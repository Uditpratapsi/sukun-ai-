<!DOCTYPE html><html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100d20">
<title>Sukoon AI - My Personal Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d20;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 15px;text-align:center;background:#1b1530;border-bottom:1px solid #44305f}
.logo{font-size:35px}
h1{font-size:25px;margin:8px 0;color:#e5b7ff}
header p{color:#c9bbda;margin:0;font-size:13px}
#chat{height:calc(100dvh - 245px);min-height:240px;overflow-y:auto;padding:15px}
.msg{padding:12px 14px;margin:10px 0;border-radius:15px;max-width:88%;line-height:1.5;overflow-wrap:anywhere}
.bot{background:#28203e;border:1px solid #49375f}
.user{background:#713cc0;margin-left:auto}
.label{color:#e5b7ff;font-size:12px;margin-bottom:5px}
footer{padding:12px;background:#1b1530;position:sticky;bottom:0}
.controls{display:flex;gap:8px}
input{flex:1;min-width:0;border-radius:24px;padding:13px;background:#29213b;color:white;border:1px solid #655080;font-size:15px}
button{border:0;border-radius:22px;background:#a75be8;color:white;padding:12px 15px;font-size:15px}
.small{text-align:center;color:#bdb0ce;font-size:11px;padding-top:10px}
</style>
</head>
<body>
<header>
<div class="logo">🌸</div>
<h1>SUKOON AI</h1>
<p>MY PERSONAL ASSISTANT</p>
</header>
<main id="chat">
<div class="msg bot"><div class="label">💗 SUKOON</div>Haan jaanu! ❤️ Main yahan hoon. Mujhse baat karo. Neeche apna message likho aur Send dabao.</div>
</main>
<footer>
<div class="controls">
<input id="message" placeholder="Jaanu, yahan likho..." autocomplete="off">
<button id="send">Send ➤</button>
<button id="voice" aria-label="Speak">🎙️</button>
</div>
<div class="small">Sukoon AI • Personal Assistant</div>
</footer>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('message');
function add(text,who){
 const box=document.createElement('div');
 box.className='msg '+who;
 const label=document.createElement('div');
 label.className='label';
 label.textContent=who==='bot'?'💗 SUKOON':'YOU';
 const body=document.createElement('div');
 body.textContent=text;
 box.append(label,body);
 chat.appendChild(box);
 chat.scrollTop=chat.scrollHeight;
}
function speak(text){
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.lang='hi-IN';
  utter.rate=0.92;
  speechSynthesis.speak(utter);
 }
}
function reply(){
 const text=input.value.trim();
 if(!text)return;
 add(text,'user');
 input.value='';
 const answer='Jaanu, tumhara message mil gaya ❤️ Abhi main basic demo hoon. Asli AI jawab ke liye secure AI service connect karni hogi.';
 setTimeout(()=>{add(answer,'bot');speak(answer)},300);
}
document.getElementById('send').addEventListener('click',reply);
input.addEventListener('keydown',e=>{if(e.key==='Enter')reply()});
document.getElementById('voice').addEventListener('click',()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){add('Jaanu, is browser mein voice typing support nahi mil raha. Keyboard microphone ka use karo.','bot');return}
 const rec=new SR();
 rec.lang='hi-IN';
 rec.onresult=e=>{input.value=e.results[0][0].transcript;reply()};
 rec.onerror=()=>add('Microphone mein dikkat hai. Permission check karo ya keyboard microphone use karo.','bot');
 rec.start();
});
</script>
</body>
</html>

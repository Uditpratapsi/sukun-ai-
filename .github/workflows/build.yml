name: Build Sukoon AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app.js'
      - 'web.js'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Sukoon AI
        run: |
          npm init -y
          npm install @capacitor/core@^7 @capacitor/android@^7 @capacitor-community/speech-recognition@7
          npm install --save-dev @capacitor/cli@^7 esbuild
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.uditpratapsi.sukoonai",
            "appName": "Sukoon AI",
            "webDir": "www"
          }
          EOF
          mkdir -p www
          cp index.html www/index.html
          npx esbuild app.js --bundle --format=iife --outfile=www/bundle.js
          npx cap add android
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          unzip -t "$APK"
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Sukoon-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
